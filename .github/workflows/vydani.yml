# TitulkyCZ_Fuki – automatické sestavení a vydání APK
# Spustí se po nahrání tagu ve tvaru v* (např. v0.20.1-fuki8) nebo ručně (Actions → Vydání → Run workflow).
# Potřebné Secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   – podpisový klíč (.jks) zakódovaný do base64
#   KEYSTORE_PASSWORD – heslo ke klíči
#   KEY_ALIAS         – alias klíče (např. fuki)
#   KEY_PASSWORD      – heslo k aliasu (obvykle stejné jako KEYSTORE_PASSWORD)
name: Vydání

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sestaveni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Podpisový klíč
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Chybí secret KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/klic.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/klic.jks" >> "$GITHUB_ENV"

      - name: Sestavení APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
          VERZE=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "TitulkyCZ_Fuki_${VERZE}.apk"
          echo "VERZE=$VERZE" >> "$GITHUB_ENV"

      - name: Vydání na GitHubu
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VERZE) }}
          name: TitulkyCZ_Fuki ${{ env.VERZE }}
          files: TitulkyCZ_Fuki_*.apk
          generate_release_notes: true
