# TitulkyCZ_Fuki – kontrola, že se aplikace sestaví (po každém nahrání, bez podpisu a bez vydání)
name: Kontrola

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  sestaveni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Sestavení (debug)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
